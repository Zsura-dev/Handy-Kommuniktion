;border-radius:11px;padding:12px 17px;font-weight:800;min-height:45px}.btn.alt{background:#344d70;color:#fff;border:1px solid #8ba2c3}.status{padding:13px 15px;border-radius:11px;margin-top:13px;background:#273f5d;font-weight:750}.status.ok{border:1px solid #65e8b8;color:#b9ffdc}.status.bad{border:1px solid #ff998f;color:#ffccbf}.result{margin-top:7px;font-size:15px;font-weight:800}.good{color:#9affce}.wrong{color:#ffb4ab}.itemgood{border-left:4px solid #59e2a9;padding-left:12px}.itembad{border-left:4px solid #fa9487;padding-left:12px}.hint{border-left:3px solid #7be9db;background:#29415d;border-radius:9px;padding:12px 15px;margin-top:10px;line-height:1.6}.help{margin-top:8px;background:#304b6a;border:1px solid #8da7c9;border-radius:9px;color:#fff;padding:8px 11px;font-size:14px}.progress{margin:12px 0;color:#b8eae4;font-weight:750}.track{height:9px;background:#0d213b;border-radius:9px;overflow:hidden;margin:8px 0 13px}.bar{height:100%;background:#72e5d3;transition:width .2s}.reading{font-size:18px;line-height:2.2}.reading p{margin:0 0 22px}.gap{display:inline-flex;align-items:center;vertical-align:middle;gap:4px;white-space:nowrap}.gap select{width:min(220px,47vw);background:#10223d;color:#fff;border:1px solid #9db1cc;border-radius:9px;padding:7px;font-size:15px}.gap.good select{border:2px solid #62e2ad}.gap.wrong select{border:2px solid #ff9287}.num{font-size:12px;color:#83f4df;font-weight:850}.bank{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.word{border:1px solid #6a89a9;background:#2b4362;border-radius:9px;padding:7px 10px;font-size:14px}.word.used{opacity:.43;text-decoration:line-through}.lightbox{background:#294260;border:1px solid #64819f;border-radius:12px;padding:16px;margin:14px 0}.note{background:#2c4662;border-radius:11px;padding:14px;margin-top:14px}.blogseg{padding:15px;border-radius:12px;margin:14px 0;color:#172b43;line-height:1.65}.b0{background:#e2f0ff}.b1{background:#e3f7e8}.b2{background:#ffedc5}.b3{background:#f7dce8}.b4{background:#e9ddff </style></head><body><main id="app" class="wrap"><div class="top"><span class="brand">▣ DeutschTraining</span></div><div class="hero"><span class="tag">B1+ / B2 · SPRACHTRAINING</span><h1>Handy & Kommunikation</h1><p class="muted">Wortschatz · Lesen · Grammatik · Sprechen</p></div><div class="panel"><h2>Öffne die Übungen im Browser.</h2><p>Wenn die Aufgaben in einer Dateivorschau nicht erscheinen, öffne die HTML-Datei in Chrome oder Edge.</p></div></main><script>const DATA={"collocations": [["Kontakte", "pflegen", "mit anderen in Verbindung bleiben"], ["die Privatsphäre", "schützen", "persönliche Informationen nicht öffentlich machen"], ["Nachrichten", "austauschen", "einander Informationen schicken"], ["Missverständnisse", "vermeiden", "dafür sorgen, dass man etwas richtig versteht"], ["die Bildschirmzeit", "begrenzen", "weniger Zeit vor dem Bildschirm verbringen"], ["Hemmungen", "überwinden", "sich etwas trauen"], ["persönliche Kontakte", "vernachlässigen", "sich nicht genug um Freunde oder Familie kümmern"], ["Benachrichtigungen", "ausschalten", "Meldungen am Handy deaktivieren"]], "context": [["Obwohl Lena in einer anderen Stadt wohnt, können wir regelmäßig ___.", "in Kontakt bleiben", "weiter miteinander sprechen oder schreiben"], ["Wer jede Nachricht sofort beantworten muss, fühlt sich schnell ___.", "unter Druck gesetzt", "gestresst; man glaubt, sofort reagieren zu müssen"], ["Beim Chatten können leicht ___ entstehen, weil man die Stimme nicht hört.", "Missverständnisse", "wenn eine Nachricht anders verstanden wird als gemeint"], ["Viele Jugendliche wollen ihre ___ schützen und posten deshalb keine privaten Fotos.", "Privatsphäre", "der persönliche Bereich, der nicht für alle offen ist"], ["Wenn ich lerne, ___ ich die Benachrichtigungen.", "deaktiviere", "deaktivieren; keine Meldungen mehr bekommen"], ["Manche Menschen ___ ihre Freundschaften, wenn sie sich kaum noch persönlich treffen.", "vernachlässigen", "sich nicht genug um etwas kümmern"], ["Mit einem Videoanruf kann man auch über große Entfernungen Kontakte ___.", "pflegen", "in Verbindung bleiben"], ["Um konzentrierter zu lernen, sollte man seine Bildschirmzeit ___.", "begrenzen", "reduzieren; nicht so lange online sein"]], "clozeWords": ["verändert", "erreichbar", "austauschen", "pflegen", "erleichtert", "abgelenkt", "vernachlässigen", "Missverständnisse", "Privatsphäre", "begrenzen", "bewusst", "persönlich", "vergessen", "ausdrucken", "verbieten", "unabhängig"], "clozeAnswers": ["verändert", "erreichbar", "austauschen", "pflegen", "erleichtert", "abgelenkt", "vernachlässigen", "Missverständnisse", "Privatsphäre", "begrenzen", "bewusst", "persönlich"], "clozeParagraphs": ["Hallo zusammen! Ich bin 17 Jahre alt. In unserer Klasse haben wir darüber diskutiert, wie das Internet unsere Kommunikation (1) ___. Früher musste man manchmal tagelang auf einen Brief warten. Heute sind wir fast immer (2) ___ und können sofort reagieren.", "Für mich hat das viele Vorteile. Wenn sich der Stundenplan ändert, können wir Informationen schnell (3) ___. Auch mit Freunden, die weit weg wohnen, kann ich Kontakte (4) ___. Außerdem (5) ___ mir mein Smartphone den Alltag: Ich kann Fahrpläne nachsehen, Fotos machen und Nachrichten verschicken.", "Aber es gibt auch Probleme. Wenn beim Lernen ständig neue Nachrichten kommen, bin ich schnell (6) ___. Manchmal habe ich sogar das Gefühl, dass wir persönliche Gespräche (7) ___: Letzte Woche saßen wir im Café, aber fast alle schauten auf ihr Handy. Dabei entstehen online auch (8) ___, weil man den Gesichtsausdruck der anderen Person nicht sehen kann.", "Ein weiteres Thema ist die (9) ___. Ich finde, niemand muss jedes Foto aus seinem Leben teilen. Deshalb möchte ich meine Bildschirmzeit (10) ___ und das Handy (11) ___ benutzen. Besonders wichtig ist mir, mit meinen Freunden auch (12) ___ zu sprechen. Technik kann unsere Beziehungen unterstützen – sie sollte sie aber nicht ersetzen. Wie seht ihr das?"], "grammar": [{"label": "wenn · Bedingung", "source": "Du schaltest die Benachrichtigungen aus. Du kannst dich besser konzentrieren.", "lead": "Wenn", "answer": "Wenn du die Benachrichtigungen ausschaltest, kannst du dich besser konzentrieren.", "help": "wenn: Im Nebensatz steht das konjugierte Verb am Ende."}, {"label": "weil · Grund", "source": "Viele Jugendliche nutzen Messenger. Sie möchten schnell mit Freunden kommunizieren.", "lead": "Viele Jugendliche", "answer": "Viele Jugendliche nutzen Messenger, weil sie schnell mit Freunden kommunizieren möchten.", "help": "weil: Die Begründung steht im Nebensatz; das Verb steht am Ende."}, {"label": "um … zu · Ziel (gleiches Subjekt)", "source": "Ich schalte mein Handy aus. Ich möchte ungestört lernen.", "lead": "Ich", "answer": "Ich schalte mein Handy aus, um ungestört zu lernen.", "help": "um … zu + Infinitiv: Beide Handlungen haben dasselbe Subjekt (ich)."}, {"label": "damit · Ziel (verschiedene Subjekte)", "source": "Die Eltern erklären die Regeln. Ihre Kinder sollen sicher im Internet unterwegs sein.", "lead": "Die Eltern", "answer": "Die Eltern erklären die Regeln, damit ihre Kinder sicher im Internet unterwegs sein können.", "help": "damit: Man nennt ein Ziel. Die handelnden Personen können verschieden sein. Das Verb steht am Ende."}, {"label": "obwohl · Gegensatz", "source": "Das Smartphone ist praktisch. Es kann uns auch ablenken.", "lead": "Obwohl", "answer": "Obwohl das Smartphone praktisch ist, kann es uns auch ablenken.", "help": "obwohl: Man nennt einen Gegensatz. Das Verb steht im Nebensatz am Ende."}, {"label": "um … zu · Ziel (gleiches Subjekt)", "source": "Lena begrenzt ihre Bildschirmzeit. Sie möchte mehr Zeit für Freunde haben.", "lead": "Lena", "answer": "Lena begrenzt ihre Bildschirmzeit, um mehr Zeit für Freunde zu haben.", "help": "um … zu + Infinitiv: Das Subjekt bleibt gleich (Lena / sie)."}, {"label": "damit · Ziel (verschiedene Subjekte)", "source": "Ich schreibe eine klare Nachricht. Mein Freund soll mich richtig verstehen.", "lead": "Ich", "answer": "Ich schreibe eine klare Nachricht, damit mein Freund mich richtig versteht.", "help": "damit: Die beiden Teilsätze haben unterschiedliche Subjekte (ich / mein Freund)."}, {"label": "wenn · Folge", "source": "Man schaut beim Gespräch ständig aufs Handy. Die andere Person fühlt sich nicht ernst genommen.", "lead": "Wenn", "answer": "Wenn man beim Gespräch ständig aufs Handy schaut, fühlt sich die andere Person nicht ernst genommen.", "help": "wenn: Bedingung im Nebensatz; danach beginnt der Hauptsatz mit dem Verb."}], "blog": [["Hallo zusammen! In unserem Schulforum diskutieren wir gerade darüber, ob Jugendliche ihr Smartphone öfter ausschalten sollten. Ich möchte dazu meine Meinung schreiben.", "Einleitung"], ["Ich finde, dass wir selbst entscheiden sollten, wann wir online sind. Ein Smartphone ist hilfreich, aber wir müssen nicht jede Nachricht sofort beantworten.", "Meinung"], ["Ein Vorteil ist, dass wir Freunde auch über große Entfernungen erreichen und wichtige Informationen schnell austauschen können. Außerdem hilft uns das Handy im Alltag, zum Beispiel bei der Orientierung.", "Vorteile / Pro-Argumente"], ["Andererseits lenken ständige Benachrichtigungen beim Lernen ab. Wenn wir beim Treffen dauernd auf den Bildschirm schauen, leiden persönliche Gespräche darunter. Manchmal fühlen wir uns auch unter Druck gesetzt, sofort zu antworten.", "Nachteile / Kontra-Argumente"], ["Letzten Samstag habe ich mein Handy beim Treffen mit Freunden in der Tasche gelassen. Wir haben lange geredet und viel gelacht. Seitdem schalte ich beim Lernen öfter die Benachrichtigungen aus.", "Persönliches Beispiel"], ["Zusammenfassend denke ich: Das Handy ist nicht das Problem. Entscheidend ist, wie bewusst wir es benutzen. Wie seht ihr das?", "Schluss"]], "cluster": ["Erreichbarkeit", "Kosten", "Funktionen", "Statussymbol", "Kontrolle", "Intimsphäre", "Bezug zu Literatur und/oder Film", "… (eigener Aspekt)"]};
'use strict';
const app=document.getElementById('app');const state={};const checked={};const helps={};const selected=new Set();let page='home';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(section,i)=>section+'_'+i;
function setValue(id,v){state[id]=v;refresh(false)}
function saveText(id,v){state[id]=v; if(checked.grammar){const row=document.activeElement?.closest('.task');if(row){const i=Number(id.split('_')[1]);const ok=gramCorrect(v,DATA.grammar[i].answer,i);row.classList.toggle('itemgood',ok);row.classList.toggle('itembad',!ok);const r=row.querySelector('.result');if(r){r.className='result '+(ok?'good':'wrong');r.textContent=ok?'✓ Richtig':'✕ Noch nicht richtig – prüfe deinen Satz';}}}}
function refresh(){render()}
function nav(p){page=p;render();window.scrollTo(0,0)}
function shell(content){app.innerHTML=`<header class="top"><span class="brand">▣ DeutschTraining</span>${page==='home'?'':`<button class="home" onclick="nav('home')">⌂ Startseite</button>`}</header>${content}<footer class="foot">Handy & Kommunikation · Eine HTML-Datei · Ohne Anmeldung</footer>`}
function intro(n,title,sub,mat){return `<section class="hero"><span class="tag">${n}</span><h1>${esc(title)}</h1><p class="muted">${esc(sub)}</p></section><div class="material">MATERIAL · ${esc(mat)}</div>`}
function home(){let tiles=[['1','Wortschatz aktivieren','1A Wortverbindungen · 1B Im Kontext','vocab'],['2','Immer online?','Zusammenhängender Lückentext','reading'],['3','Grammatik anwenden','wenn · weil · obwohl · um … zu · damit','grammar'],['4','Blogkommentar untersuchen','Argumente und Textaufbau erkennen','blog'],['5','DSD-Cluster: Handy','Drei Aspekte auswählen und sprechen','cluster']];shell(`<section class="hero"><span class="tag">B1+ / B2 · SPRACHTRAINING</span><h1>Handy & Kommunikation</h1><p class="muted">Wortschatz → Lesen → Grammatik → Argumentieren → Sprechen</p></section><div class="grid">${tiles.map(t=>`<button class="tile" onclick="nav('${t[3]}')"><span class="tag">MODUL ${t[0]}</span><strong>${t[1]}</strong><small>${t[2]}</small></button>`).join('')}</div><div class="note"><strong>Im Unterricht:</strong> Bearbeite nur die Aufgabe, die deine Lehrkraft nennt. Danach besprechen wir die Ergebnisse gemeinsam. <br><strong>Diskussion „Entscheide dich!“:</strong> Wir machen sie zusammen im Klassenraum – ohne digitale Abstimmung.</div>`)}
function mixOptions(values,seed){let a=[...values],x=((seed+1)*2654435761)>>>0;for(let i=a.length-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;const j=Math.floor((x/4294967296)*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function dropdown(id,values){return `<select class="select" aria-label="Antwort auswählen" onchange="setValue('${id}',this.value)"><option value="">– Bitte auswählen –</option>${mixOptions(values,[...id].reduce((a,c)=>Math.imul(a^c.charCodeAt(0),16777619)>>>0,2166136261)).map(v=>`<option value="${esc(v)}" ${state[id]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function result(id,answer,section){if(!checked[section])return '';let ok=state[id]===answer;return `<div class="result ${ok?'good':'wrong'}">${ok?'✓ Richtig':'✕ Noch nicht richtig – bitte korrigieren'}</div>`}
function hint(id,body){return `<button class="help" onclick="helps['${id}']=!helps['${id}'];refresh(false)">💡 Hilfe</button>${helps[id]?`<div class="hint">${esc(body)}</div>`:''}`}
function control(section,total,score){return `<div class="buttons"><button class="btn" onclick="checked['${section}']=true;refresh(false)">✓ ${section==='grammar'?'Sätze':'Antworten'} überprüfen</button><button class="btn alt" onclick="resetSection('${section}')">↻ Noch einmal</button></div><div class="progress">${checked[section]?score+' von '+total+' richtig':Object.keys(state).filter(k=>k.startsWith(section+'_')&&state[k]).length+' von '+total+' bearbeitet'}</div><div class="track"><div class="bar" style="width:${(checked[section]?score:Object.keys(state).filter(k=>k.startsWith(section+'_')&&state[k]).length)/total*100}%"></div></div>${checked[section]?`<div class="status ${score===total?'ok':'bad'}">${score===total?'✓ Alles richtig! Sehr gut.':'✓ Grün = richtig · ✕ Rot = noch nicht richtig. Korrigiere die markierten Antworten.'}</div>`:''}`}
function resetSection(section){Object.keys(state).filter(k=>k.startsWith(section+'_')).forEach(k=>delete state[k]);checked[section]=false;Object.keys(helps).filter(k=>k.startsWith(section)).forEach(k=>delete helps[k]);refresh(false)}
function vocab(){let c=DATA.collocations,opts=c.map(x=>x[1]),rows=c.map(([l,r,h],i)=>{let id=key('coll',i);return `<div class="task ${checked.coll?(state[id]===r?'itemgood':'itembad'):''}"><p class="q"><strong>${i+1}.</strong> ${esc(l)} …</p>${dropdown(id,opts)}${result(id,r,'coll')}${hint('collhint'+i,h)}</div>`}).join('');let contexts=DATA.context,ctxopts=contexts.map(x=>x[1]),ctxrows=contexts.map(([s,r,h],i)=>{let id=key('ctx',i);return `<div class="task ${checked.ctx?(state[id]===r?'itemgood':'itembad'):''}"><p class="q"><strong>${i+1}.</strong> ${esc(s)}</p>${dropdown(id,ctxopts)}${result(id,r,'ctx')}${hint('ctxhint'+i,h)}</div>`}).join('');shell(intro('01','Wortschatz aktivieren','Zuerst Wortverbindungen, dann Wörter im Satz verwenden.','Handy · Heft')+`<section class="panel"><h2>1A · Welche Wörter passen zusammen?</h2><p>Ergänze die passenden Verben. Jedes Verb wird einmal verwendet.</p>${rows}${control('coll',c.length,c.filter(([l,r],i)=>state[key('coll',i)]===r).length)}</section><section class="panel"><h2>1B · Wortschatz im Kontext</h2><p>Ergänze die Sätze. Achte auf die Bedeutung im Zusammenhang.</p>${ctxrows}${control('ctx',contexts.length,contexts.filter(([s,r],i)=>state[key('ctx',i)]===r).length)}</section>`)}
function reading(){let bank=mixOptions(DATA.clozeWords,42),ans=DATA.clozeAnswers,chosen=ans.map((_,i)=>state[key('read',i)]).filter(Boolean);let article=DATA.clozeParagraphs.map(s=>`<p>${esc(s).replace(/\((\d+)\) ___/g,(_,n)=>{let i=+n-1,id=key('read',i);let status=checked.read?(state[id]===ans[i]?'good':'wrong'):'';return `<span class="gap ${status}"><span class="num">${n}</span><select aria-label="Lücke ${n}" onchange="setValue('${id}',this.value)"><option value="">– Wort –</option>${mixOptions(bank,i+77).map(w=>`<option value="${esc(w)}" ${state[id]===w?'selected':''}>${esc(w)}</option>`).join('')}</select>${checked.read?`<span class="gapmark ${status}" aria-label="${status==='good'?'Richtig':'Noch nicht richtig'}">${status==='good'?'✓':'✕'}</span>`:''}</span>`})}</p>`).join('');shell(intro('02','Immer online – kommunizieren wir wirklich besser?','Lies den ganzen Beitrag. Ergänze zwölf Lücken; vier Wörter bleiben übrig.','Handy · Heft')+`<section class="panel"><h2>2A · Lückentext: Ein Beitrag aus dem Schulforum</h2><p>Wähle die Wörter, die inhaltlich und grammatisch passen. Jedes Wort darf nur einmal verwendet werden.</p><div class="lightbox"><strong>Wortkasten</strong><div class="bank">${bank.map(w=>`<span class="word ${chosen.includes(w)?'used':''}">${esc(w)}</span>`).join('')}</div></div><div class="reading">${article}</div>${control('read',12,ans.filter((v,i)=>state[key('read',i)]===v).length)}</section><div class="speaking"><strong>Nach dem Lesen – gemeinsam mit der Lehrkraft</strong><ol><li>Wie hat das Internet die Kommunikation verändert?</li><li>Welche Vorteile und Nachteile nennt die Person?</li><li>Warum können Missverständnisse entstehen?</li><li>Wie kann man das Smartphone bewusst benutzen?</li></ol><p>Notiere Stichwörter in deinem Heft. Die Fragen besprechen wir gemeinsam.</p></div>`)}
function normalize(s){return String(s||'').trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'').replace(/\s+([,;:])/g,'$1')}
const GRAMMAR_ALTERNATIVES = [
["Du kannst dich besser konzentrieren, wenn du die Benachrichtigungen ausschaltest."],
["Weil sie schnell mit Freunden kommunizieren möchten, nutzen viele Jugendliche Messenger."],
["Um ungestört zu lernen, schalte ich mein Handy aus."],
["Damit ihre Kinder sicher im Internet unterwegs sind, erklären die Eltern die Regeln.","Die Eltern erklären die Regeln, damit ihre Kinder sicher im Internet unterwegs sind.","Die Eltern erklären die Regeln, damit ihre Kinder sicher im Internet unterwegs sein können.","Damit ihre Kinder sicher im Internet unterwegs sein können, erklären die Eltern die Regeln."],
["Das Smartphone kann uns auch ablenken, obwohl es praktisch ist.","Obwohl das Smartphone praktisch ist, kann es uns ablenken.","Das Smartphone kann uns ablenken, obwohl es praktisch ist."],
["Um mehr Zeit für Freunde zu haben, begrenzt Lena ihre Bildschirmzeit."],
["Damit mein Freund mich richtig versteht, schreibe ich eine klare Nachricht."],
["Die andere Person fühlt sich nicht ernst genommen, wenn man beim Gespräch ständig aufs Handy schaut."]
];
function gramCorrect(input,target,index){return [target,...(GRAMMAR_ALTERNATIVES[index]||[])].some(a=>normalize(input)===normalize(a))}
function grammar(){let g=DATA.grammar,score=g.filter((x,i)=>gramCorrect(state[key('grammar',i)],x.answer,i)).length;let rows=g.map((x,i)=>{let id=key('grammar',i),ok=gramCorrect(state[id],x.answer,i);return `<div class="task ${checked.grammar?(ok?'itemgood':'itembad'):''}"><span class="tag">${esc(x.label)}</span><p class="q"><strong>${i+1}.</strong> ${esc(x.source)}</p><p class="small muted">Beginne mit: <strong>${esc(x.lead)}</strong></p><input class="answer" value="${esc(state[id]||'')}" oninput="saveText('${id}',this.value)" aria-label="Satz ${i+1}" placeholder="Schreibe den vollständigen Satz …" spellcheck="false">${checked.grammar?`<div class="result ${ok?'good':'wrong'}">${ok?'✓ Richtig':'✕ Vergleiche deinen Satz mit dem Lösungsvorschlag:'}</div>${ok?'':`<div class="hint"><strong>Musterlösung:</strong> ${esc(x.answer)}</div>`}`:''}${hint('gramhint'+i,x.help)}</div>`}).join('');shell(intro('03','Grammatik anwenden','Verbinde die Sätze selbst. Schreibe vollständige Sätze.','Handy · Heft')+`<section class="panel"><h2>3A · Sätze verbinden</h2><p><strong>Achte auf Groß- und Kleinschreibung, Kommas, Satzstellung und Satzzeichen.</strong> Die automatische Kontrolle erkennt ausgewählte korrekte Satzstellungen. Andere sprachlich richtige Formulierungen können ebenfalls möglich sein; besprecht sie mit der Lehrkraft.</p>${rows}${control('grammar',g.length,score)}</section><div class="speaking"><strong>Jetzt sprechen wir.</strong><p>Bilde einen eigenen Satz mit <strong>um … zu</strong> und einen mit <strong>damit</strong> zum Thema Handy. Erkläre den Unterschied.</p></div>`)}
const ARGUMENTS = [
 ['Mit dem Smartphone kann man auch über große Entfernungen mit Freunden und der Familie in Kontakt bleiben.','pro'],
 ['Im Notfall kann man schnell Hilfe rufen.','pro'],
 ['Man kann jederzeit Informationen für die Schule oder den Alltag finden.','pro'],
 ['Messenger ermöglichen einen schnellen Austausch von Nachrichten.','pro'],
 ['Ständige Benachrichtigungen können die Konzentration stören.','contra'],
 ['Wer beim Treffen dauernd aufs Display schaut, vernachlässigt persönliche Gespräche.','contra'],
 ['Wenn man private Fotos unüberlegt teilt, kann die Privatsphäre verletzt werden.','contra'],
 ['Zu viel Bildschirmzeit kann dazu führen, dass man weniger Zeit für andere Aktivitäten hat.','contra']
];
let activeArgument=null;
const ARGUMENT_ORDER=[5,1,7,2,4,0,6,3]; // bewusst gemischte Pro-/Kontra-Reihenfolge

function argumentPlace(i,zone){state[key('arg',i)]=zone;activeArgument=null;refresh(false)}
function argumentPick(i){activeArgument=activeArgument===i?null:i;refresh(false)}
function argumentDrop(e,zone){e.preventDefault();const i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0&&i<ARGUMENTS.length)argumentPlace(i,zone)}
function argumentCard(i){const [txt,correct]=ARGUMENTS[i],where=state[key('arg',i)]||'',evaluated=checked.arg&&where;return `<button type="button" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" onclick="argumentPick(${i})" class="argcard ${activeArgument===i?'picked':''} ${evaluated?(where===correct?'argok':'argbad'):''}" aria-pressed="${activeArgument===i}" title="Klicken und dann eine Kategorie wählen">${esc(txt)}${evaluated?`<span class="result ${where===correct?'good':'wrong'}">${where===correct?' ✓ Richtig':' ✕ Noch nicht richtig'}</span>`:''}</button>`}
function argumentZone(zone,title){let ids=ARGUMENT_ORDER.filter(i=>state[key('arg',i)]===zone);return `<div class="argzone ${activeArgument!==null?'activezone':''}" role="group" aria-label="${title}" ondragover="event.preventDefault()" ondrop="argumentDrop(event,'${zone}')"><h3>${title}</h3><p class="argtip">Karte hierher ziehen oder Karte anklicken und dann „Hier zuordnen“ wählen.</p><button class="btn alt" onclick="if(activeArgument!==null)argumentPlace(activeArgument,'${zone}')" ${activeArgument===null?'disabled':''}>Hier zuordnen</button>${ids.length?ids.map(argumentCard).join(''):'<p class="argempty">Noch keine Argumente zugeordnet.</p>'}</div>`}
function argumentsExercise(){let done=ARGUMENTS.filter((_,i)=>state[key('arg',i)]).length,correct=ARGUMENTS.filter((x,i)=>state[key('arg',i)]===x[1]).length;return `<section class="panel"><h2>4B · Argumente zuordnen</h2><p>Lies die acht Argumente. Welche sprechen <strong>für</strong> und welche <strong>gegen</strong> eine intensive Handynutzung? Ordne sie zu.</p><p class="argtip">Tippe auf eine Karte und anschließend auf „Hier zuordnen“. Am Computer kannst du die Karten auch mit der Maus ziehen.</p><div class="argpool">${ARGUMENT_ORDER.map(i=>!state[key('arg',i)]?argumentCard(i):'').join('')}</div><div class="arggrid" style="margin-top:17px">${argumentZone('pro','Dafür – Vorteile')}${argumentZone('contra','Dagegen – Nachteile')}</div><div class="buttons"><button class="btn" onclick="checked.arg=true;refresh(false)">✓ Antworten überprüfen</button><button class="btn alt" onclick="resetSection('arg');activeArgument=null">↻ Noch einmal</button></div><div class="progress">${done} von ${ARGUMENTS.length} zugeordnet</div><div class="track"><div class="bar" style="width:${100*done/ARGUMENTS.length}%"></div></div>${checked.arg?`<div class="status ${correct===ARGUMENTS.length?'ok':'bad'}">${correct} von ${ARGUMENTS.length} richtig. ${correct===ARGUMENTS.length?'Sehr gut!':'Überprüfe die rot markierten Argumente und versuche es erneut.'}</div>`:''}<div class="note"><strong>Arbeite jetzt im Heft:</strong> Schreibe die vier Argumente dafür und die vier Argumente dagegen in dein Heft. Ergänze auf jeder Seite mindestens ein eigenes Argument. Begründe deine Meinung mit einem Beispiel.</div></section>`}
function blog(){let b=DATA.blog,labels=b.map(x=>x[1]),score=b.filter((x,i)=>state[key('blog',i)]===x[1]).length;let rows=b.map(([txt,label],i)=>{let id=key('blog',i);return `<div class="blogrow task ${checked.blog?(state[id]===label?'itemgood':'itembad') :''}"><div class="blogseg b${i}">${esc(txt)}</div><div>${dropdown(id,labels)}${result(id,label,'blog')}</div></div>`}).join('');shell(intro('04','Blogkommentar untersuchen','Lies den ganzen Kommentar und erkenne seine Funktion.','Handy · Heft')+`<section class="panel"><h2>4A · Aufbau eines Blogkommentars</h2><p>Ordne den farbig markierten Abschnitten die richtige Funktion zu. Jede Funktion kommt einmal vor.</p>${rows}${control('blog',b.length,score)}</section>${argumentsExercise()}`)}
function cluster(){let a=DATA.cluster;let cells=a.map((x,i)=>`<button class="aspect ${selected.has(i)?'active':''}" aria-pressed="${selected.has(i)}" onclick="selected.has(${i})?selected.delete(${i}):selected.add(${i});refresh(false)">${esc(x)}${selected.has(i)?' ✓':''}</button>`);shell(intro('05','Cluster: Handy','Wähle mindestens drei Aspekte aus und bereite einen fünfminütigen freien Vortrag vor.','Heft · Lehrbuch')+`<section class="panel"><h2>Cluster: Handy</h2><p><strong>Aufgabe:</strong> Vertiefe das Thema anhand von mindestens drei der folgenden Stichwörter. Wähle mindestens drei Aspekte aus, notiere Stichwörter in deinem Heft und sprich anschließend fünf Minuten frei und zusammenhängend über das Thema.</p><div class="cluster">${cells[0]}${cells[1]}${cells[2]}${cells[3]}<div class="center">Handy</div>${cells[4]}${cells[5]}${cells[6]}${cells[7]}</div><div class="progress">${selected.size} Aspekte ausgewählt ${selected.size>=3?'✓':'· Wähle mindestens drei.'}</div>${selected.size>=3?`<div class="note"><strong>Deine Auswahl:</strong> ${[...selected].map(i=>esc(a[i])).join(' · ')}<p>Notiere zu jedem gewählten Aspekt mehrere Stichwörter und ein konkretes Beispiel in deinem Heft. Formuliere keine vollständige Rede zum Ablesen.</p></div>`:''}</section><section class="panel"><h2>So baust du deinen Vortrag auf</h2><p class="muted">Wähle passende Satzanfänge aus und sprich fünf Minuten frei über mindestens drei Aspekte.</p><div class="speechgrid"><div class="speechstep"><h3>1 · Einstieg</h3><p>„In meinem Vortrag spreche ich über das Thema <strong>Handy</strong>.“</p><p>„Ich habe die folgenden Aspekte gewählt: <strong>…</strong>, <strong>…</strong> und <strong>…</strong>.“</p></div><div class="speechstep"><h3>2 · Gliederung</h3><p>„Zuerst spreche ich über <strong>…</strong>. Dann gehe ich auf <strong>…</strong> ein. Danach erläutere ich <strong>…</strong>. Zum Schluss fasse ich die wichtigsten Punkte zusammen.“</p></div><div class="speechstep"><h3>3 · Erster Aspekt</h3><p>„Ich komme nun zu meinem ersten Aspekt: <strong>…</strong>.“</p><p>„Diesen Aspekt möchte ich nun genauer erläutern.“</p></div><div class="speechstep"><h3>4 · Übergänge</h3><p>„Als zweiten Aspekt möchte ich <strong>…</strong> betrachten.“</p><p>„Das führt mich zum nächsten Punkt.“</p><p>„Nun komme ich zu meinem dritten Aspekt: <strong>…</strong>.“</p></div><div class="speechstep"><h3>5 · Meinung und Begründung</h3><p>„Dafür spricht, dass <strong>…</strong>.“</p><p>„Dagegen spricht, dass <strong>…</strong>.“</p><p>„Meiner Meinung nach <strong>…</strong>.“</p><p>„Der Grund dafür ist, dass <strong>…</strong>.“</p><p>Gib ein konkretes Beispiel.</p></div><div class="speechstep"><h3>6 · Schluss</h3><p>„Zusammenfassend lässt sich sagen, dass <strong>…</strong>.“</p><p>„Mein Fazit lautet: <strong>…</strong>.“</p></div></div><div class="note"><strong>Deine Aufgabe:</strong> Sprich fünf Minuten frei und in zusammenhängenden Sätzen. Nutze deine Stichwörter, lies aber keinen fertigen Text ab.</div></section>`)}
function render(){try{({home,vocab,reading,grammar,blog,cluster}[page]||home)()}catch(e){app.innerHTML='<h1>Die Aufgabe konnte nicht angezeigt werden.</h1><p>Bitte öffne die Datei in Chrome oder Edge.</p>';console.error(e)}}render();
</script></body></html>
